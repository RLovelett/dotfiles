source-file ~/.config/tmux/signal-rail-colors.conf

# Reusable mode segments. Zsh stores @zsh_vi_mode on the active pane.
set -g @signal_rail_mode_insert '#[fg=#{E:@signal_rail_success},bg=#{E:@signal_rail_surface_raised},bold] INSERT #[default] '
set -g @signal_rail_mode_normal '#[fg=#{E:@signal_rail_secondary},bg=#{E:@signal_rail_surface_raised},bold] NORMAL #[default] '

set -g status-position bottom
set -g status-left-length 80
set -g status-right-length 150
set -g status-style 'fg=#{E:@signal_rail_text},bg=default'
set -g status-left '#{?#{==:#{@zsh_vi_mode},NORMAL},#{E:@signal_rail_mode_normal},#{E:@signal_rail_mode_insert}}#[bg=default,bold]#{?client_prefix,#[fg=#{E:@signal_rail_attention}]󰠠,#[fg=#{E:@signal_rail_secondary}]󰤂} #[fg=#{E:@signal_rail_secondary}]#S #[default]'
set -g status-right '#[fg=#{E:@signal_rail_primary},bg=default] #[fg=#{E:@signal_rail_text}]#{s|#{HOME}|~|:pane_current_path} #[default]'

set -gw window-status-separator ''
set -gw window-status-style 'fg=#{E:@signal_rail_text_muted},bg=default'
set -gw window-status-format ' #{?#{==:#{pane_current_command},ssh},ssh ,}#I:#W · #{?window_zoomed_flag,z,p}#P#{?window_last_flag, #[fg=#{E:@signal_rail_secondary}]↩#[fg=#{E:@signal_rail_text_muted}],} '
set -gw window-status-current-style 'fg=#{E:@signal_rail_text},bg=#{E:@signal_rail_surface_raised},bold'
set -gw window-status-current-format ' #[fg=#{E:@signal_rail_primary}]#{?#{==:#{pane_current_command},ssh},ssh ,}#I:#W #[fg=#{E:@signal_rail_text_muted}]· #[fg=#{E:@signal_rail_secondary}]#{?window_zoomed_flag,z,p}#P#{?window_last_flag, ↩,} '
set -gw window-status-last-style default
set -gw window-status-activity-style 'fg=#{E:@signal_rail_attention},bg=default'
set -gw window-status-bell-style 'fg=#{E:@signal_rail_attention},bg=default,bold'

set -g pane-border-style 'fg=#{E:@signal_rail_surface_raised}'
set -g pane-active-border-style 'fg=#{E:@signal_rail_primary}'
set -g pane-border-status off
set -g mode-style 'fg=#{E:@signal_rail_on_accent},bg=#{E:@signal_rail_primary},bold'
set -g message-style 'fg=#{E:@signal_rail_on_accent},bg=#{E:@signal_rail_secondary},bold'
set -g message-command-style 'fg=#{E:@signal_rail_on_accent},bg=#{E:@signal_rail_primary},bold'
set -g popup-border-style 'fg=#{E:@signal_rail_primary}'
