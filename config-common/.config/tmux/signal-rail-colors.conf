# Duplicated from Signal Rail's Dracula palette and semantic color roles.
# Keep these values aligned with the QML theme deliberately; tmux has no
# runtime dependency on the desktop configuration.
set -g @signal_rail_background '#282a36'
set -g @signal_rail_surface_raised '#44475a'
set -g @signal_rail_text '#f8f8f2'
set -g @signal_rail_text_muted '#6272a4'
set -g @signal_rail_primary '#8be9fd'
set -g @signal_rail_secondary '#bd93f9'
set -g @signal_rail_tertiary '#ff79c6'
set -g @signal_rail_success '#50fa7b'
set -g @signal_rail_warning '#ffb86c'
set -g @signal_rail_critical '#ff5555'
set -g @signal_rail_attention '#ffb86c'
set -g @signal_rail_on_accent '#282a36'
