# The starting point for this configuration was:
# Dreams of Code - Tmux has forever changed the way I write code
# https://www.youtube.com/watch?v=DzNmUNvnB04

# Enable true color support for all xterm-based terminals to enhance color
# rendering. Added this to fix nvim coloring in tmux.
set-option -sa terminal-overrides ",xterm*:Tc"

# Ghostty reports modified keys with the extended keyboard protocol. Without
# this, tmux collapses combinations such as Shift+Enter into plain Enter.
set-option -s extended-keys on
set-option -s extended-keys-format csi-u
set-option -as terminal-features ",xterm-ghostty:extkeys"

# Enable mouse support in tmux. This setting allows the mouse to be used for
# selecting panes, resizing panes, scrolling, and other interactions within tmux
# windows and panes.
set -g mouse on

# Change the default command prefix from Ctrl+b (C-b) to Ctrl+Space (C-Space).
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Configure tmux to start window and pane indexes at 1 instead of the default 0.
# This makes numbering align with the number row on the keyboard.
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Configuration settings for plugins
set -g @tokyo-night-tmux_show_datetime 0
set -g @tokyo-night-tmux_show_path 1
set -g @tokyo-night-tmux_path_format relative
set -g @tokyo-night-tmux_window_id_style dsquare
set -g @tokyo-night-tmux_show_git 0

# Declare tmux plugins managed by tmux Plugin Manager (tpm). This includes
# plugins for enhanced tmux navigation, tmux-yank for clipboard operations, and
# a tmux theme.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'dreamsofcode-io/catppuccin-tmux'
set -g @plugin 'janoamaral/tokyo-night-tmux'
set -g @plugin 'tmux-plugins/tmux-yank'

# Initialize tmux Plugin Manager (tpm) to manage plugin installations and
# updates.
run '~/.config/.tmux/plugins/tpm/tpm'

# Set vi mode
set-window-option -g mode-keys vi

# Setup key bindings for copy mode using vi key bindings. This allows starting
# selection with 'v', toggling rectangle selection with Ctrl+v, and copying with
# 'y'.
bind-key -T copy-mode-vi -N 'Begin selection' v send-keys -X begin-selection
bind-key -T copy-mode-vi -N 'Toggle rectangular selection' C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi -N 'Copy selection and exit' y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi -N 'Cancel copy mode' q send-keys -X cancel
bind-key -T copy-mode-vi -N 'Search forward' / command-prompt -T search -p '(search down)' { send-keys -X search-forward -- '%%' }
bind-key -T copy-mode-vi -N 'Search backward' ? command-prompt -T search -p '(search up)' { send-keys -X search-backward -- '%%' }
bind-key -T copy-mode-vi -N 'Next search match' n send-keys -X search-again
bind-key -T copy-mode-vi -N 'Previous search match' N send-keys -X search-reverse

# Open new panes in the same directory as the current pane. This facilitates
# continuity when working in the same directory.
bind-key -N 'Stacked split (tmux standard)' '"' split-window -v -c "#{pane_current_path}"
bind-key -N 'Side-by-side split (tmux standard)' % split-window -h -c "#{pane_current_path}"
bind-key -N 'Side-by-side split' '|' split-window -h -c "#{pane_current_path}"
bind-key -N 'Stacked split' _ split-window -v -c "#{pane_current_path}"
bind-key -r -N 'Shrink current pane' - run-shell '~/.local/bin/tmux-resize-parent shrink #{pane_id}'
bind-key -r -N 'Grow current pane' = run-shell '~/.local/bin/tmux-resize-parent grow #{pane_id}'
bind-key -N 'Choose paste buffer' b choose-buffer -Z
bind-key -N 'Create window' c new-window -c "#{pane_current_path}"
bind-key -N 'Search key bindings' ? display-popup -E -w 90% -h 80% '~/.local/bin/tmux-keybindings'

# Toggle a persistent background session named "scratch" in a popup
bind-key -N 'Toggle scratch session' g if-shell -F '#{==:#{session_name},scratch}' {
    detach-client
} {
    display-popup -E -w 80% -h 80% "tmux attach-session -t scratch || tmux new-session -s scratch"
}

# The navigator plugin owns these commands. Attaching notes after TPM loads it
# makes the effective cross-Neovim navigation visible in live key help.
bind-key -n -N 'Focus pane left or pass to Neovim' C-h
bind-key -n -N 'Focus pane down or pass to Neovim' C-j
bind-key -n -N 'Focus pane up or pass to Neovim' C-k
bind-key -n -N 'Focus pane right or pass to Neovim' C-l
