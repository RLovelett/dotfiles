# Prefer the USB-C EarPods for both playback and capture when connected.

monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "alsa_output.usb-Apple__Inc._EarPods_CPGHQF72RN-00.iec958-stereo"
      }
    ]
    actions = {
      update-props = {
        "priority.session" = 2300
      }
    }
  }
  {
    matches = [
      {
        node.name = "alsa_input.usb-Apple__Inc._EarPods_CPGHQF72RN-00.mono-fallback"
      }
    ]
    actions = {
      update-props = {
        "priority.session" = 2300
      }
    }
  }
  {
    matches = [
      {
        node.name = "alsa_input.usb-046d_HD_Pro_Webcam_C920_6C70DD6F-02.analog-stereo"
      }
    ]
    actions = {
      update-props = {
        # Keep the C920 below the Bose virtual microphone (priority 2010).
        "priority.session" = 2000
      }
    }
  }
  {
    matches = [
      {
        node.name = "alsa_output.pci-0000_01_00.1.hdmi-stereo-extra5"
      }
    ]
    actions = {
      update-props = {
        # Monitor-speaker fallback, below Bose (priority 1010).
        "priority.session" = 1000
      }
    }
  }
  {
    matches = [
      {
        node.name = "~alsa_output.usb-Generic_USB_Audio-00.*"
      }
      {
        node.name = "~alsa_input.usb-Generic_USB_Audio-00.*"
      }
    ]
    actions = {
      update-props = {
        # These unused motherboard endpoints must not beat the intended
        # monitor/C920 fallbacks (especially the phantom S/PDIF output).
        "priority.session" = 500
      }
    }
  }
]
