# Bose QC Ultra Headphones: use the high-quality A2DP playback profile.
# Leave codec selection to WirePlumber so it can choose the best codec
# supported by both the headphones and the Bluetooth adapter.

monitor.bluez.rules = [
  {
    matches = [
      {
        device.name = "bluez_card.AC_BF_71_CF_F5_37"
      }
    ]
    actions = {
      update-props = {
        "bluez5.auto-connect" = "[ a2dp-sink ]"
        "bluez5.hw-volume" = "[ a2dp-sink ]"
      }
    }
  }
  {
    matches = [
      {
        node.name = "bluez_input.AC:BF:71:CF:F5:37"
      }
    ]
    actions = {
      update-props = {
        "priority.session" = 2200
      }
    }
  }
]
